# The repository's commands and paths — the single home for both.
#
# AGENTS.md, the skills and the convention checker read these values by key and never
# restate them. Changing a command means changing it here, in this repository's own copy:
# that is the override mechanism, and it is why no repository needs to fork the template.
#
# Fill every slot once, at adoption (README.md, step 3). After that this file holds real
# values and nothing else: a search of the copied tree for two opening braces must print
# nothing.
convention_version: "{{CONVENTION_VERSION}}" # integer revision of the convention this copy came from
adopted_from: "{{ADOPTED_FROM}}" # commit in {{ORG}}/.github this copy came from
repo: "{{ORG}}/{{REPO_NAME}}"
language: "{{REPO_LANGUAGE}}" # e.g. Svelte, Go, HTML, or none
package_manager: "{{REPO_PACKAGE_MANAGER}}" # bun, npm, cargo, or none — never a second one

# commands: what to run, as single-line strings with no double quote in them.
# `check` is the one wrapper command that humans, agents and CI all invoke. A gate this
# repository does not have is the bare null — never the string "null", never a guess and
# never an empty string; every reader treats the bare null as "no such gate". The slots
# below stay quoted so that this unfilled template is valid YAML: step 3 (README.md) writes
# the bare null into the copy it fills in, so a literal adoption needs no hand-editing.
commands:
  check: "{{REPO_CHECK_COMMAND}}"
  test: "{{REPO_TEST_COMMAND}}"
  lint: "{{REPO_LINT_COMMAND}}"
  build: "{{REPO_BUILD_COMMAND}}"
ci_workflow: "{{REPO_CI_WORKFLOW}}" # path, or null when this repository has no CI

# paths: the documents that are authoritative for each subject. One fact has one home.
# Use `none` where this repository has no such document.
paths:
  architecture: "{{ARCH_DOC_PATH}}"
  product: "{{PRODUCT_DOC_PATH}}"
  design: "{{DESIGN_DOC_PATH}}"
