name: validate

# `validate` runs on every pull request and is the check the default branch
# requires.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bun fmt --no-script --check .
      - name: Type check
        run: bun x tsc --noEmit
      - name: Test
        run: bun test
