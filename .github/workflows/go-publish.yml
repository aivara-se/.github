name: go publish

# The organisation's optional release workflow for a Go binary, called from the
# repository on a push to its default branch.
#
# It reads VERSION and cross-compiles the caller's main package for each target.
# When the builds succeed it tags the pushed commit (unless the tag exists) and
# creates the GitHub release with the binaries (unless the release exists). A
# version that is already tagged and released is not built again.
#
# It never bumps the version, opens a pull request or pushes a commit, and it
# has no workflow_dispatch: the caller's push is the only trigger. The caller
# owns the permissions and the secrets; see docs/RELEASES.md.

on:
  workflow_call:
    inputs:
      package:
        description: The main package to build, such as ./cmd/dispatch
        type: string
        required: true
      binary:
        description: The binary's name, and the prefix of every asset
        type: string
        required: true
      targets:
        description: A JSON array of os/arch pairs
        type: string
        required: false
        default: '["linux/amd64","linux/arm64"]'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Read the version, the tag and the release
        id: read
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "VERSION carries no version: '$version'" >&2
            exit 1
          fi
          tag="v$version"
          git fetch --tags --force --quiet
          ref="$GITHUB_SHA"
          tagged=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=true
            ref="$tag"
          fi
          released=false
          if gh release view "$tag" >/dev/null 2>&1; then
            released=true
          fi
          build=true
          if [ "$tagged" = true ] && [ "$released" = true ]; then
            build=false
            echo "$tag is already tagged and released; nothing to publish"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
          PACKAGE: ${{ inputs.package }}
          BINARY: ${{ inputs.binary }}
        run: |
          set -euo pipefail
          goos=${TARGET%/*}
          goarch=${TARGET#*/}
          ext=""
          if [ "$goos" = windows ]; then ext=".exe"; fi
          asset="$BINARY-$VERSION-$goos-$goarch$ext"
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -buildvcs=false -o "dist/$asset" "$PACKAGE"
          echo "NAME=$goos-$goarch" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [meta, build]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" --verify-tag \
              --title "$TAG" --generate-notes artifacts/*
          fi
